<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Northshore Vote Map</title>
  <meta name="description" content="Live map of early voting and Election Day locations in St. Tammany and Washington Parishes, Louisiana."/>
  <meta name="theme-color" content="#12263A"/>
  <meta property="og:title" content="Northshore Vote Map"/>
  <meta property="og:description" content="Early voting and Election Day locations — St. Tammany and Washington Parishes."/>
  <meta property="og:image" content="og.jpg"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root {
      --navy:#12263a; --navy-deep:#0b1826; --ink:#1c1915; --cream:#f6f1e8;
      --cream-2:#ece4d4; --gold:#d4a853; --gold-deep:#b8892d; --pine:#1f6b57;
      --muted:#6b6458; --line:#d9d0c1; --paper:#fffdf8;
      --display:"Fraunces", Georgia, serif; --sans:"Outfit","Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:var(--sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
    button, [role=button]{cursor:pointer}
    button{font-family:inherit}
    a{color:inherit}
    .app{display:flex;flex-direction:column;height:100dvh}
    header{background:var(--navy);color:var(--cream);border-bottom:1px solid rgb(255 255 255 / .08);z-index:20}
    .hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
    .kicker{margin:0;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
    h1{margin:0;font-family:var(--display);font-size:28px;font-weight:600}
    .geaux{display:none;height:44px;align-items:center;border-radius:999px;background:var(--gold);color:var(--navy);padding:0 16px;font-size:14px;font-weight:600;text-decoration:none}
    .dates{display:flex;flex-wrap:wrap;gap:4px 16px;padding:8px 20px;border-top:1px solid rgb(255 255 255 / .1);font-size:12px;color:rgb(246 241 232 / .8)}
    .dates strong{color:var(--gold);font-weight:600}
    .body{display:flex;flex-direction:column;min-height:0;flex:1}
    .mobile-filters{padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
    .map-wrap{position:relative;height:38vh;flex-shrink:0}
    #map{height:100%;width:100%;background:var(--cream-2)}
    .legend{position:absolute;left:12px;top:12px;background:rgb(255 253 248 / .92);padding:8px 12px;border-radius:8px;font-size:12px;box-shadow:0 1px 3px rgb(18 38 58 / .12);pointer-events:none}
    .legend p{margin:0;display:flex;align-items:center;gap:8px}
    .legend p+p{margin-top:4px}
    .dot{width:10px;height:10px;border-radius:99px;display:inline-block}
    aside{display:flex;flex-direction:column;min-height:0;flex:1;background:var(--paper);border-top:1px solid var(--line)}
    .desk-filters{display:none;padding:12px 16px;border-bottom:1px solid var(--line)}
    .search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
    .search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:transparent}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink)}
    .chip.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
    .locate{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--navy);background:transparent;font-size:12px;font-weight:600;color:var(--navy)}
    .meta{margin:8px 0 0;font-size:12px;color:var(--muted)}
    .err{color:#9a3412}
    .list{flex:1;overflow:auto;min-height:0}
    .card{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent}
    .card:hover{background:var(--cream)}
    .card.sel{background:var(--cream-2)}
    .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;margin-right:6px}
    .badge.ev{background:#f3e4c0;color:var(--gold-deep)}
    .badge.ed{background:#dce8f0;color:var(--navy)}
    .name{font-weight:600;font-size:14px;margin:4px 0 0}
    .addr{margin:2px 0 0;font-size:12px;color:var(--muted)}
    .miles{float:right;font-size:12px;color:var(--muted)}
    .detail{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--cream)}
    .detail h2{margin:6px 0 0;font-family:var(--display);font-size:20px}
    .detail a.dir{display:inline-flex;margin-top:10px;height:40px;align-items:center;padding:0 14px;border-radius:999px;background:var(--gold);color:var(--navy);font-weight:600;font-size:13px;text-decoration:none}
    .ns-pin{display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px rgb(18 38 58 / .35))}
    .ns-pin span{width:18px;height:18px;border-radius:999px;border:2px solid #fff;background:var(--navy)}
    .ns-pin.is-ev span{background:var(--gold);width:20px;height:20px}
    .ns-pin.is-wa.is-ed span{background:var(--pine)}
    .ns-pin.is-selected span{width:24px;height:24px;border-width:3px}
    .leaflet-container{font-family:var(--sans);background:var(--cream-2)}
    @media(min-width:1024px){
      .body{flex-direction:row}
      .mobile-filters{display:none}
      .desk-filters{display:block}
      .map-wrap{height:auto;flex:1}
      aside{width:400px;flex:none;border-top:0;border-right:1px solid var(--line);order:-1}
      .geaux{display:inline-flex}
      h1{font-size:30px}
    }
  </style>
</head>

    const ELECTION = {"dateLabel":"Tuesday, November 3, 2026","dateIso":"2026-11-03","evStart":"2026-10-20","evEnd":"2026-10-27","evWindow":"October 20–27, 2026 (closed Sunday, Oct 25)","evHours":"8:30 a.m. – 6:00 p.m.","edHoursTue":"6:00 a.m. – 8:00 p.m.","nextElection":"Saturday, December 12, 2026","geauxVote":"https://voterportal.sos.la.gov"};
    const state = { query:"", kind:"all", parish:"all", selectedId:null, userLoc:null, locError:null };
    let map, layer;

    function miles(a,b){
      const R=3958.8, toR=x=>x*Math.PI/180;
      const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
      const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
      return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
    }
    function filtered(){
      const q=state.query.trim().toLowerCase();
      let rows=SITES.filter(s=>{
        if(state.kind!=="all" && s.kind!==state.kind) return false;
        if(state.parish!=="all" && s.parish!==state.parish) return false;
        if(!q) return true;
        return (s.name+" "+s.address+" "+s.city+" "+s.precincts.join(" ")+" "+s.zip).toLowerCase().includes(q);
      });
      if(state.userLoc){
        rows=rows.map(s=>({...s, miles:miles(state.userLoc,s)})).sort((a,b)=>a.miles-b.miles);
      }
      return rows;
    }
    function chip(label,on,fn){
      const b=document.createElement("button");
      b.className="chip"+(on?" on":"");
      b.textContent=label;
      b.onclick=fn;
      return b;
    }
    function filtersEl(){
      const wrap=document.createElement("div");
      const ev=SITES.filter(s=>s.kind==="early").length;
      const ed=SITES.filter(s=>s.kind==="election-day").length;
      const search=document.createElement("div");
      search.className="search";
      search.innerHTML='<svg width="16" height="16" fill="none" stroke="#6b6458" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>';
      const input=document.createElement("input");
      input.placeholder="Search site, city, precinct…";
      input.value=state.query;
      input.oninput=e=>{state.query=e.target.value; render()};
      search.appendChild(input);
      wrap.appendChild(search);
      const chips=document.createElement("div"); chips.className="chips";
      chips.append(
        chip("All sites", state.kind==="all", ()=>{state.kind="all"; render()}),
        chip("Early voting · "+ev, state.kind==="early", ()=>{state.kind="early"; render()}),
        chip("Election Day · "+ed, state.kind==="election-day", ()=>{state.kind="election-day"; render()}),
        chip("St. Tammany", state.parish==="St. Tammany", ()=>{state.parish=state.parish==="St. Tammany"?"all":"St. Tammany"; render()}),
        chip("Washington", state.parish==="Washington", ()=>{state.parish=state.parish==="Washington"?"all":"Washington"; render()}),
      );
      const loc=document.createElement("button");
      loc.className="locate"; loc.textContent="Near me";
      loc.onclick=()=>{
        if(!navigator.geolocation){state.locError="Location is not available in this browser."; render(); return;}
        navigator.geolocation.getCurrentPosition(
          p=>{state.userLoc={lat:p.coords.latitude,lng:p.coords.longitude}; state.locError=null; render();},
          ()=>{state.locError="Could not read your location."; render();},
          {enableHighAccuracy:true,timeout:8000}
        );
      };
      chips.appendChild(loc);
      wrap.appendChild(chips);
      const meta=document.createElement("p");
      meta.className="meta"+(state.locError?" err":"");
      const n=filtered().length;
      meta.textContent=state.locError || (n+" location"+(n===1?"":"s")+" shown");
      wrap.appendChild(meta);
      return wrap;
    }
    function renderFilters(){
      const m=document.getElementById("filters-m");
      const d=document.getElementById("filters-d");
      m.innerHTML=""; d.innerHTML="";
      m.appendChild(filtersEl());
      d.appendChild(filtersEl());
    }
    function renderList(){
      const rows=filtered();
      const list=document.getElementById("list");
      list.innerHTML="";
      for(const s of rows){
        const b=document.createElement("button");
        b.className="card"+(s.id===state.selectedId?" sel":"");
        b.onclick=()=>{state.selectedId=s.id; render();};
        const milesTxt=s.miles!=null? '<span class="miles">'+s.miles.toFixed(1)+' mi</span>':"";
        b.innerHTML=milesTxt
          +'<span class="badge '+(s.kind==="early"?"ev":"ed")+'">'+(s.kind==="early"?"Early voting":"Election Day")+'</span>'
          +'<span class="badge ed">'+s.parish+'</span>'
          +'<p class="name"></p><p class="addr"></p>';
        b.querySelector(".name").textContent=s.name;
        b.querySelector(".addr").textContent=s.address+", "+s.city+", LA "+s.zip;
        list.appendChild(b);
      }
      const det=document.getElementById("detail");
      const sel=SITES.find(s=>s.id===state.selectedId);
      if(!sel){det.innerHTML=""; return;}
      const maps="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(sel.address+", "+sel.city+", LA "+sel.zip);
      const prec=sel.precincts.length? "<p class='addr'>Precincts: "+sel.precincts.join(", ")+"</p>":"";
      det.innerHTML='<div class="detail"><span class="badge '+(sel.kind==="early"?"ev":"ed")+'">'+(sel.kind==="early"?"Early voting":"Election Day")+'</span>'
        +'<h2></h2><p class="addr"></p>'+prec
        +(sel.hours?'<p class="addr">'+sel.hours+"</p>":"")
        +(sel.phone?'<p class="addr">'+sel.phone+"</p>":"")
        +(sel.notes?'<p class="addr">'+sel.notes+"</p>":"")
        +'<a class="dir" target="_blank" rel="noreferrer" href="'+maps+'">Directions</a></div>';
      det.querySelector("h2").textContent=sel.name;
      det.querySelector(".addr").textContent=sel.address+(sel.suite?", "+sel.suite:"")+", "+sel.city+", LA "+sel.zip;
    }
    function pinIcon(site, selected){
      const cls=["ns-pin", site.kind==="early"?"is-ev":"is-ed", site.parish==="Washington"?"is-wa":"is-st", selected?"is-selected":""].join(" ");
      return L.divIcon({className:"", html:'<div class="'+cls+'"><span></span></div>', iconSize:[28,28], iconAnchor:[14,14]});
    }
    function renderMap(){
      if(!map){
        map=L.map("map",{zoomControl:false, attributionControl:true}).setView([30.52,-89.95],10);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{
          attribution:"&copy; OpenStreetMap &copy; CARTO", maxZoom:19
        }).addTo(map);
        L.control.zoom({position:"bottomright"}).addTo(map);
        layer=L.layerGroup().addTo(map);
        setTimeout(()=>map.invalidateSize(),80);
      }
      layer.clearLayers();
      const rows=filtered();
      for(const s of rows){
        const m=L.marker([s.lat,s.lng],{icon:pinIcon(s,s.id===state.selectedId), zIndexOffset:s.id===state.selectedId?800:0});
        m.on("click",()=>{state.selectedId=s.id; render();});
        m.addTo(layer);
      }
      const sel=SITES.find(s=>s.id===state.selectedId);
      if(sel) map.flyTo([sel.lat,sel.lng], Math.max(map.getZoom(),13), {duration:.4});
      map.invalidateSize();
    }
    function render(){ renderFilters(); renderList(); renderMap(); }
    render();
    addEventListener("resize", ()=>map && map.invalidateSize());
  </script>
